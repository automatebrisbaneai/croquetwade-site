  <div class="titlebar"><span>🏆 Bamford's Comeback — Cairo 2013</span><div class="titlebar-btns"><span class="titlebar-btn btn-other">─</span><span class="titlebar-btn btn-other">□</span><span class="titlebar-btn btn-close" onclick="window.close()">×</span></div></div>

<script>
// ═══ Bamford's Comeback — Cairo 2013 ═══
// Retro arcade edition. Drawn at 300x260, blitted 2x, CRT glass on top.
var screen=document.getElementById('c'),sctx=screen.getContext('2d');
var W=300,H=260,SCALE=2;
var buf=document.createElement('canvas');buf.width=W;buf.height=H;
var ctx=buf.getContext('2d');
sctx.imageSmoothingEnabled=false;

var COURT={x1:26,y1:64,x2:274,y2:238};
var HORIZON=52;

// ── Safe storage (private mode / sandboxed embeds block localStorage) ──
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

// ── Audio engine (all synthesized) ─────────────────────
var actx=null,master=null,ambGain=null,ambSrc=null,droneNodes=null;
var muted=lsGet('bamford-mute')==='1';
function AC(){
  try{
    if(!actx){
      actx=new(window.AudioContext||window.webkitAudioContext)();
      var comp=actx.createDynamicsCompressor();
      master=actx.createGain();master.gain.value=muted?0:0.9;
      master.connect(comp);comp.connect(actx.destination);
      // crowd ambience: looping filtered noise
      var len=actx.sampleRate*2,nb=actx.createBuffer(1,len,actx.sampleRate),d=nb.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
      ambSrc=actx.createBufferSource();ambSrc.buffer=nb;ambSrc.loop=true;
      var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=450;bp.Q.value=0.6;
      ambGain=actx.createGain();ambGain.gain.value=0;
      ambSrc.connect(bp);bp.connect(ambGain);ambGain.connect(master);ambSrc.start();
    }
    if(actx.state==='suspended')actx.resume();
  }catch(e){actx=null;}
}
function setMute(m){muted=m;lsSet('bamford-mute',m?'1':'0');if(master)master.gain.value=m?0:0.9;}
function tone(f,o){
  o=o||{};AC();if(!actx)return;var t=actx.currentTime+(o.at||0);
  var osc=actx.createOscillator(),g=actx.createGain();
  osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);
  if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+(o.dur||0.2));
  g.gain.setValueAtTime(o.g||0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+(o.dur||0.2));
  osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+(o.dur||0.2)+0.05);
  osc.onended=function(){try{osc.disconnect();g.disconnect();}catch(e){}};
}
function noiseBurst(dur,g,o){
  o=o||{};AC();if(!actx)return;var t=actx.currentTime+(o.at||0);
  var len=Math.ceil(actx.sampleRate*dur),nb=actx.createBuffer(1,len,actx.sampleRate),d=nb.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var src=actx.createBufferSource();src.buffer=nb;
  var f=actx.createBiquadFilter();f.type=o.hp?'highpass':'lowpass';f.frequency.value=o.hp||o.lp||1500;
  var gn=actx.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f);f.connect(gn);gn.connect(master);src.start(t);
  src.onended=function(){try{src.disconnect();f.disconnect();gn.disconnect();}catch(e){}};
}
function sCoin(){tone(988,{dur:0.08,g:0.08});tone(1319,{dur:0.3,g:0.08,at:0.08});}
function sKnock(){noiseBurst(0.05,0.25,{lp:1400});tone(170,{type:'sine',dur:0.09,g:0.14});}
function sClang(){tone(880,{dur:0.12,g:0.1,slide:640});tone(1320,{dur:0.08,g:0.05});noiseBurst(0.04,0.08,{hp:2200});}
function sThud(){tone(120,{type:'sine',dur:0.1,g:0.1});}
function sBlip(){tone(1400,{dur:0.018,g:0.025});}
function sTick(){tone(2000,{dur:0.02,g:0.05});}
function sPerfect(){tone(1047,{type:'triangle',dur:0.07,g:0.08});tone(1568,{type:'triangle',dur:0.1,g:0.08,at:0.07});}

function droneOn(){
  if(droneNodes)return;AC();if(!actx)return;
  var g=actx.createGain();g.gain.setValueAtTime(0.0001,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.035,actx.currentTime+2);
  var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=190;
  var o1=actx.createOscillator(),o2=actx.createOscillator();
  o1.type='sawtooth';o1.frequency.value=55;o2.type='sawtooth';o2.frequency.value=55.8;
  o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
  droneNodes={o1:o1,o2:o2,g:g};
}
function droneOff(){
  if(!droneNodes)return;
  var d=droneNodes;droneNodes=null;
  d.g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.4);
  setTimeout(function(){d.o1.stop();d.o2.stop();},600);
}

function getLeaderboard(){
  var lb=null;
  try{lb=JSON.parse(lsGet('bamford-lb')||'null');}catch(e){}
  if(!lb||!lb.length)lb=[{name:'REGBAM',hoops:5},{name:'CLAUDE',hoops:4},{name:'WADEH!',hoops:3}];
  return lb;
}
function saveScore(name,hoops){
  var lb=getLeaderboard();lb.push({name:name.toUpperCase().substring(0,6),hoops:hoops});
  lb.sort(function(a,b){return b.hoops-a.hoops;});lb=lb.slice(0,5);
  lsSet('bamford-lb',JSON.stringify(lb));
}

// ── Drawing helpers ─────────────────────────────────────
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function text(str,x,y,font,c,align){
  ctx.font=font;ctx.fillStyle=c;ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';
  ctx.fillText(str,Math.round(x),Math.round(y));
}
function ps(str,x,y,size,c,align){text(str,x,y,size+'px PS2P',c,align);}
function vt(str,x,y,size,c,align){text(str,x,y,size+'px VT',c,align);}
// per-char monospace draw: kills font ligatures, keeps the pixel grid
function vtMono(str,x,y,size,c){
  ctx.font=size+'px VT';ctx.fillStyle=c;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  var adv=size/2;
  for(var i=0;i<str.length;i++)ctx.fillText(str[i],Math.round(x+i*adv),Math.round(y));
}

function drawSky(){
  var s=SKIES[stage()];
  var g=ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,s[0]);g.addColorStop(0.6,s[1]);g.addColorStop(1,s[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HORIZON);
  var st=stage();
  // stars
  if(st>=2){
    var a=[0,0,0.4,0.85,1][st];
    stars.forEach(function(s2){
      var tw=0.5+0.5*Math.sin(frame*0.05+s2.tw);
      ctx.fillStyle='rgba(255,255,230,'+(a*tw).toFixed(2)+')';
      ctx.fillRect(s2.x,s2.y,1,1);
    });
  }
  // sun / moon
  if(st===0){px(244,12,8,8,'#fff3c4');px(242,14,12,4,'#fff3c4');}
  if(st===1){px(52,38,14,10,'#ffca6a');px(48,42,22,6,'#ffca6a');}
  if(st>=3){ // crescent moon
    px(228,10,8,8,'#e8e8d0');px(226,12,12,4,'#e8e8d0');
    ctx.fillStyle=SKIES[st][0];ctx.fillRect(230,8,8,7);
  }
  // clouds
  if(st<=2){
    var cc=st===0?'#fdf3e0':st===1?'#f5b98a':'#3a3055';
    clouds.forEach(function(cl){
      var cx=(cl.x+frame*0.02)%(W+50)-25;
      px(cx,cl.y+3,cl.w,4,cc);px(cx+5,cl.y,cl.w-12,4,cc);
    });
  }
}

function drawLawn(){
  var st=stage();
  // apron (outside court)
  ctx.fillStyle=APRONS[st];ctx.fillRect(0,HORIZON,W,H-HORIZON);
  // mowing stripes
  var L=LAWNS[st];
  for(var x=COURT.x1;x<COURT.x2;x+=31){
    ctx.fillStyle=((x-COURT.x1)/31)%2<1?L[0]:L[1];
    ctx.fillRect(x,COURT.y1,Math.min(31,COURT.x2-x),COURT.y2-COURT.y1);
  }
  // floodlit warmth at night
  if(st>=3){
    ctx.fillStyle='rgba(255,244,180,0.05)';
    ctx.fillRect(COURT.x1,COURT.y1,COURT.x2-COURT.x1,COURT.y2-COURT.y1);
  }
  // boundary line
  ctx.strokeStyle=st>=2?'rgba(255,255,255,0.6)':'rgba(255,255,255,0.75)';
  ctx.lineWidth=1;
  ctx.strokeRect(COURT.x1+0.5,COURT.y1+0.5,COURT.x2-COURT.x1-1,COURT.y2-COURT.y1-1);
  // corner flags
  [[COURT.x1,COURT.y1],[COURT.x2-1,COURT.y1],[COURT.x1,COURT.y2-1],[COURT.x2-1,COURT.y2-1]].forEach(function(p){

}

function drawCrowd(){

  crowd.forEach(function(p,i){

    if(celebrating)jump=Math.abs(Math.sin(frame*0.25+p.ph))*3;
    else if(!tense)jump=Math.sin(frame*0.04+p.ph)>0.9?1:0;
    var y=p.y-jump;
    px(p.x,y+3,4,5,p.c);          // shirt
    px(p.x+1,y,2,3,p.skin);       // head
    if(celebrating&&i%2===0){px(p.x-1,y+3,1,2,p.skin);px(p.x+4,y+3,1,2,p.skin);} // arms up
  });

  if(st>=3&&(celebrating||state==='rolling')&&Math.random()<(celebrating?0.3:0.05)){
    var fx=30+Math.random()*240,fy=42+Math.random()*12;

function drawBallSprite(x,y,z,color,hi,rolling){
  var yy=y-z;
  // shadow shrinks while airborne
  var sw=z>1?3:4;
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();ctx.ellipse(x,y+3,sw,1.5,0,0,6.29);ctx.fill();
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(x,yy,4,0,6.29);ctx.fill();
  // rolling pip
  if(rolling!==undefined){
    var a=rolling;
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.fillRect(Math.round(x+Math.cos(a)*2)-1,Math.round(yy+Math.sin(a)*2)-1,2,2);
  }
  ctx.fillStyle=hi;
  ctx.fillRect(Math.round(x-2),Math.round(yy-2),1,1);
}

  var sweet=getSweetPower();

function drawAimArrow(){
  var len=30;
  var ex=ball.x+Math.cos(aimAngle)*len,ey=ball.y+Math.sin(aimAngle)*len;
  ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.lineDashOffset=-frame*0.3;
  ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(ex,ey);
  ctx.lineTo(ex-Math.cos(aimAngle-0.35)*6,ey-Math.sin(aimAngle-0.35)*6);
  ctx.lineTo(ex-Math.cos(aimAngle+0.35)*6,ey-Math.sin(aimAngle+0.35)*6);ctx.fill();
}

function commentaryFull(){var hp=HOOPS[hoopIndex];return hp.commentary.join('\n');}
function drawCommentary(){
  var hp=HOOPS[hoopIndex];
  var panelY=148,panelH=100;
  px(26,panelY,W-52,panelH,'#08080e');
  ctx.strokeStyle='#c8a415';ctx.lineWidth=1;
  ctx.strokeRect(27.5,panelY+1.5,W-55,panelH-3);
  px(26,panelY,3,panelH,'#c8a415');
  ps(hp.label,52,panelY+16,8,'#ffd75e','left');
  vt(hp.dist,W-40,panelY+15,10,'#c8a415','right');
  px(40,panelY+21,W-80,1,'rgba(200,164,21,0.35)');
  // typewriter body
  var full=commentaryFull();
  var shown=full.substring(0,Math.floor(typeLen));
  var lines=shown.split('\n');
  var yy=panelY+34;
  lines.forEach(function(ln){
    // wrap long lines
    while(ln.length>36){
      var cut=ln.lastIndexOf(' ',36);if(cut<10)cut=36;
      vtMono(ln.substring(0,cut),40,yy,12,'#e8e4d8');yy+=12;ln=ln.substring(cut+1);
    }
    vtMono(ln,40,yy,12,'#e8e4d8');yy+=12;
  });
  commentDone=(Math.floor(typeLen)>=full.length);
  if(commentDone&&frame%60<36)vt('» CLICK',W-42,panelY+panelH-8,10,'#ffd75e','right');
}

    c:['#ffd75e','#ff6a5e','#6aa8ff','#7dff8e','#ff9ede'][Math.floor(Math.random()*5)]});
}
function updateFireworks(){
  for(var i=fireworks.length-1;i>=0;i--){
    var f=fireworks[i];
    if(!f.burst){
      f.y+=f.vy;
      if(f.y<=f.ty){
        f.burst=true;
        noiseBurst(0.2,0.08,{lp:3000});
        for(var j=0;j<18;j++){
          var a=j/18*6.28,sp=0.8+Math.random()*0.9;
          particles.push({x:f.x,y:f.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:40+Math.random()*20,c:f.c,grav:0.02});
        }
        fireworks.splice(i,1);
      }
    }
  }
}
function drawFireworkRockets(){

// ── Particles / popups ──────────────────────────────────
function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*slowmo;p.y+=p.vy*slowmo;p.vy+=(p.grav||0.05)*slowmo;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(function(p){
    if(p.life<12&&p.life%4<2)return; // twinkle out
    px(p.x,p.y,p.s||1,p.s||1,p.c);
  });
}
function addPopup(str,x,y,c,size){popups.push({str:str,x:x,y:y,c:c,size:size||8,life:60});}
function updateDrawPopups(){
  for(var i=popups.length-1;i>=0;i--){
    var p=popups[i];p.y-=0.3;p.life--;
    if(p.life<=0){popups.splice(i,1);continue;}
    if(p.life<15&&p.life%4<2)continue;
    // black pixel outline so popups read on any background
    ps(p.str,p.x-1,p.y,p.size,'#000');ps(p.str,p.x+1,p.y,p.size,'#000');
    ps(p.str,p.x,p.y-1,p.size,'#000');ps(p.str,p.x,p.y+1,p.size,'#000');
    ps(p.str,p.x,p.y,p.size,p.c);
  }
}
function burstConfetti(x,y,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,sp=0.5+Math.random()*1.4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.8,life:35+Math.random()*25,
      c:['#ffd75e','#ff6a5e','#6aa8ff','#7dff8e','#fff'][Math.floor(Math.random()*5)],grav:0.05});
  }
}
function grassKick(x,y,n){
  for(var i=0;i<n;i++)particles.push({x:x,y:y,vx:(Math.random()-0.5)*1.2,vy:-Math.random()*1,life:14+Math.random()*10,c:'#1c5c26',grav:0.08});
}
function sparks(x,y){
  for(var i=0;i<6;i++)particles.push({x:x,y:y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:10+Math.random()*8,c:'#fff',grav:0});
}

// ── Aim assist / physics (mechanics unchanged from 1.0) ─
function getTargetAngle(){return Math.atan2(hoop.y-ball.y,hoop.x-ball.x);}
function getSweetPower(){
  var dx=hoop.x-ball.x,dy=hoop.y-ball.y;
  return Math.min(1,Math.max(0.2,Math.sqrt(dx*dx+dy*dy)/110));
}
function getAimSpeed(){
  var target=getTargetAngle();
  var diff=Math.abs(aimAngle-target);
  if(diff<0.15)return baseAimSpeed*0.3;
  if(diff<0.3)return baseAimSpeed*0.55;
  return baseAimSpeed;
}

var HOOP_W=15;
var hoopPassed=false,prevBallY=0;
function checkHoopCollision(b){
  var hoopLine=hoop.y+3;
  var inGapX=Math.abs(b.x-hoop.x)<HOOP_W/2;
  if(inGapX&&!hoopPassed){
    var crossedDown=(prevBallY<=hoopLine&&b.y>=hoopLine);
    var crossedUp=(prevBallY>=hoopLine&&b.y<=hoopLine);
    // zone catch only for balls heading THROUGH, not grazing sideways across the face
    var insideZone=Math.abs(b.y-hoopLine)<10&&Math.abs(b.vy)>=Math.abs(b.vx)*0.7;
    if(crossedDown||crossedUp||insideZone){
      if(Math.abs(b.vx)>0.1||Math.abs(b.vy)>0.1){hoopPassed=true;return'score';}
    }
  }
  var leftX=hoop.x-HOOP_W/2-1.5;
  if(Math.abs(b.x-leftX)<4.5&&Math.abs(b.y-hoopLine)<8)return'bounce_left';
  var rightX=hoop.x+HOOP_W/2+1.5;
  if(Math.abs(b.x-rightX)<4.5&&Math.abs(b.y-hoopLine)<8)return'bounce_right';
  return null;
}
function moveBall(b){
  b.x+=b.vx*slowmo;b.y+=b.vy*slowmo;
  var f=1-(1-0.988)*slowmo;
  b.vx*=f;b.vy*=f;
  if(b.x<COURT.x1+4){b.x=COURT.x1+4;b.vx=Math.abs(b.vx)*0.5;if(b===ball)sThud();}
  if(b.x>COURT.x2-4){b.x=COURT.x2-4;b.vx=-Math.abs(b.vx)*0.5;if(b===ball)sThud();}
  if(b.y<COURT.y1+4){b.y=COURT.y1+4;b.vy=Math.abs(b.vy)*0.5;if(b===ball)sThud();}
  if(b.y>COURT.y2-4){b.y=COURT.y2-4;b.vy=-Math.abs(b.vy)*0.5;if(b===ball)sThud();}
}
function ballsCollide(){
  var dx=red.x-ball.x,dy=red.y-ball.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d>=8){
    // swept test: a fast ball must not tunnel through the red ball in one step
    var mx=ball.x-ballPX,my=ball.y-ballPY,len2=mx*mx+my*my;
    if(len2<0.01)return false;
    var t=((red.x-ballPX)*mx+(red.y-ballPY)*my)/len2;
    if(t<=0||t>=1)return false;
    var cx=ballPX+mx*t,cy=ballPY+my*t,sdx=red.x-cx,sdy=red.y-cy;
    if(sdx*sdx+sdy*sdy>=60)return false;
    ball.x=cx;ball.y=cy; // rewind to the moment of contact
    dx=red.x-ball.x;dy=red.y-ball.y;d=Math.sqrt(dx*dx+dy*dy)||0.01;
  }
  if(d===0)return false;
  if(hopping)return false; // mid-hop: clears the guard
  // Bamford jump shot: perfect strike hops the guard ball
  if(perfectShot&&ball.z===0){
    hopping=true;hopDist=0;sJump();
    addPopup('JUMP!',ball.x,ball.y-14,'#ffd75e',8);
    return false;
  }
  if(ball.z>1)return false; // airborne — sails over
  // equal-mass elastic: swap normal components
  var nx=dx/d,ny=dy/d;
  var vbn=ball.vx*nx+ball.vy*ny,vrn=red.vx*nx+red.vy*ny;
  if(vbn-vrn<=0)return false;
  var bTan={x:ball.vx-vbn*nx,y:ball.vy-vbn*ny};
  var rTan={x:red.vx-vrn*nx,y:red.vy-vrn*ny};
  ball.vx=bTan.x+vrn*nx*0.9;ball.vy=bTan.y+vrn*ny*0.9;
  red.vx=rTan.x+vbn*nx*0.9;red.vy=rTan.y+vbn*ny*0.9;
  var overlap=8-d;ball.x-=nx*overlap/2;ball.y-=ny*overlap/2;red.x+=nx*overlap/2;red.y+=ny*overlap/2;
  sKnock();sparks((ball.x+red.x)/2,(ball.y+red.y)/2);
  return true;
}

// ── Setup ───────────────────────────────────────────────
function setupHoop(){
  var hp=HOOPS[hoopIndex];
  ball.x=hp.bx;ball.y=hp.by;ball.vx=0;ball.vy=0;ball.z=0;ball.roll=0;
  hoop.x=hp.hx;hoop.y=hp.hy;
  red.x=hp.hx+hp.gdx;red.y=hp.hy+hp.gdy;red.vx=0;red.vy=0;
  aimAngle=getTargetAngle()+0.3;aimDir=-1;
  bounced=false;hopping=false;perfectShot=false;slowmo=1;
  nasrMood=0;regSwing=0;
  buildCrowd();
  setAmb(0.008+stage()*0.005);
  if(hoopIndex===4)droneOn();
}

// ── Update ──────────────────────────────────────────────
function update(){
  frame++;
  if(shake>0)shake*=0.85;
  if(flashTimer>0)flashTimer--;
  if(scoreFlash>0)scoreFlash--;
  if(regSwing>0)regSwing--;
  if(wipeDir!==0){
    wipe+=wipeDir*0.05;
    if(wipe>=1){wipe=1;wipeDir=-1;hoopIndex++;setupHoop();commentaryTimer=0;typeLen=0;state='commentary';}
    if(wipe<=0){wipe=0;wipeDir=0;}
  }
  if(state==='commentary'){
    commentaryTimer++;
    var full=commentaryFull();
    if(typeLen<full.length){
      typeLen+=0.55;
      if(Math.floor(typeLen)%3===0&&full[Math.floor(typeLen)]!==' ')sBlip();
    }
  }
  if(state==='aiming'){
    aimAngle+=getAimSpeed()*aimDir;
    var ta=getTargetAngle();
    if(aimAngle>ta+0.5)aimDir=-1;if(aimAngle<ta-0.5)aimDir=1;
  }
  if(state==='power'){
    power+=powerSpeed*powerDir;
    if(power>1){power=1;powerDir=-1;}if(power<0){power=0;powerDir=1;}
  }
  if(state==='rolling'){
    prevBallY=ball.y;ballPX=ball.x;ballPY=ball.y;
    // slow-mo drama on the final hoop approach
    if(hoopIndex===4){
      var dx=hoop.x-ball.x,dy=hoop.y-ball.y;
      var close=Math.sqrt(dx*dx+dy*dy)<50&&(Math.abs(ball.vx)>0.3||Math.abs(ball.vy)>0.3);
      slowmo=close?0.35:1;
    }
    moveBall(ball);
    ball.roll+=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*slowmo*0.25;
    // jaw guide: a clean attempt at the gap gets funnelled through
    var jawLine=hoop.y+3;
    var toward=(ball.y>jawLine&&ball.vy<0)||(ball.y<jawLine&&ball.vy>0);
    if(toward&&Math.abs(ball.x-hoop.x)<HOOP_W/2+3&&Math.abs(ball.y-jawLine)<16){
      ball.vx+=(hoop.x-ball.x)*0.02*slowmo;
    }
    // jump shot arc
    if(hopping){
      hopDist+=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*slowmo;
      var pr=Math.min(1,hopDist/hopLen);
      ball.z=Math.sin(pr*Math.PI)*7;
      if(pr>=1){hopping=false;ball.z=0;grassKick(ball.x,ball.y+3,4);}
    }
    // red ball rolls too after a knock
    if(Math.abs(red.vx)>0.01||Math.abs(red.vy)>0.01){
      moveBall(red);
      if(Math.abs(red.vx)<0.04&&Math.abs(red.vy)<0.04){red.vx=0;red.vy=0;}
    }
    ballsCollide();
    var hit=checkHoopCollision(ball);
    if(hit==='score'&&!scored){
      scored=true;bamfordScore++;scoreFlash=40;scoreFlashSide='b';
      shake=3;burstConfetti(hoop.x,hoop.y,22);
      droneOff();slowmo=1;nasrMood=1;
      sHoop();sTick();
      if(hoopIndex===4){flashTimer=10;}
      state='scored';resultTimer=0;
    } else if(hit==='bounce_left'&&!bounced){
      bounced=true;ball.vx=-Math.abs(ball.vx)*0.6-0.5;ball.vy*=0.5;sClang();sparks(hoop.x-HOOP_W/2,hoop.y+3);shake=1.5;
    } else if(hit==='bounce_right'&&!bounced){
      bounced=true;ball.vx=Math.abs(ball.vx)*0.6+0.5;ball.vy*=0.5;sClang();sparks(hoop.x+HOOP_W/2,hoop.y+3);shake=1.5;
    }
    if(!scored&&Math.abs(ball.vx)<0.04&&Math.abs(ball.vy)<0.04&&!hopping){
      ball.vx=0;ball.vy=0;droneOff();slowmo=1;sMiss();state='missed';resultTimer=0;
    }
  }
  if(state==='scored'){
    resultTimer++;
    // the ball keeps rolling through the hoop and out the back
    if(Math.abs(ball.vx)>0.04||Math.abs(ball.vy)>0.04){
      ballPX=ball.x;ballPY=ball.y;
      moveBall(ball);
      ball.roll+=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*0.25;
      ballsCollide();
    }
    if(hopping){
      hopDist+=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      var hpr=Math.min(1,hopDist/hopLen);
      ball.z=Math.sin(hpr*Math.PI)*7;
      if(hpr>=1){hopping=false;ball.z=0;}
    }
    if(resultTimer>110){
      if(bamfordScore>=7){
        state='won';finalHoops=5;beginNameEntry();
        confetti=[];for(var i=0;i<60;i++)confetti.push({x:Math.random()*W,y:Math.random()*-150,w:2+Math.random()*2,h:2+Math.random()*4,vx:(Math.random()-0.5),vy:0.5+Math.random()*1.5,color:['#ffd75e','#6aa8ff','#ff6a5e','#7dff8e','#fff','#c8a415'][Math.floor(Math.random()*6)]});
        setAmb(0.04);sWin();
      } else if(wipeDir===0){wipeDir=1;wipe=0.001;}
    }
  }
  if(state==='missed'){
    resultTimer++;
    if(resultTimer>100){
      nasrScore++;scoreFlash=40;scoreFlashSide='n'; // Nasr takes the deciding hoop
      finalHoops=hoopIndex;nasrMood=2;state='lost';beginNameEntry();setAmb(0.03);
    }
  }
  if(state==='won'||state==='lost'){/* screens self-animate */}
  // heartbeat on final hoop
  if(hoopIndex===4&&(state==='aiming'||state==='power')){
    heartbeatTimer++;
    if(heartbeatTimer>55){heartbeatTimer=0;sHeartbeat();}
  }
}

// ── Draw ────────────────────────────────────────────────
function drawPlayfield(){
  drawSky();drawSkyline();drawFloodlights();drawLawn();drawCrowd();
  function drawTrail(){
    if(state==='rolling'&&(Math.abs(ball.vx)>0.6||Math.abs(ball.vy)>0.6)){
      for(var i=1;i<=3;i++){
        ctx.fillStyle='rgba(120,160,255,'+(0.25-i*0.07)+')';
        ctx.fillRect(Math.round(ball.x-ball.vx*i*1.6)-1,Math.round(ball.y-ball.vy*i*1.6-ball.z)-1,2,2);
      }
    }
  }
  function drawBlue(){drawBallSprite(ball.x,ball.y,ball.z,'#3366cc','#99bbee',ball.roll);}
  function drawRed(){drawBallSprite(red.x,red.y,0,'#cc3333','#ee9999');}
  // depth-sort: once the ball is through, it rolls on BEHIND the hoop
  if(ball.y<hoop.y+1){
    drawTrail();drawBlue();drawHoop(hoop.x,hoop.y);drawRed();
  } else {
    drawHoop(hoop.x,hoop.y);drawRed();drawTrail();drawBlue();
  }
  drawReg();drawNasr();
  updateParticles();drawParticles();
  drawScoreboard();
  if(state==='aiming'){
    drawAimArrow();
    px(0,H-15,W,15,'rgba(0,0,0,0.5)');
    if(frame%70<52)vt('CLICK TO SET DIRECTION',W/2,H-5,12,'#ffd75e');
  }
  if(state==='power'){
    drawAimArrow();drawPowerBar();
    px(0,H-15,W,15,'rgba(0,0,0,0.5)');
    if(frame%70<52)vt('CLICK TO SET POWER · WHITE LINE = SWEET SPOT',W/2,H-5,12,'#ffd75e');
  }
  if(state==='commentary')drawCommentary();
  if(state==='scored'){
    if(hoopIndex===4&&resultTimer<95){
      px(24,104,W-48,44,'rgba(8,8,14,0.9)');
      ctx.strokeStyle='#ffd75e';ctx.strokeRect(25.5,105.5,W-51,41);
      ps('"GOD, WHAT A SHOT!"',W/2,124,8,'#ffd75e');
      vt('- heard courtside, Cairo 2013',W/2,140,10,'#cfc9a8');
    } else {
      ps('HOOP!',W/2,H/2-2,12,'#7dff8e');
      vt('BAMFORD '+bamfordScore+' - '+nasrScore+' NASR',W/2,H/2+14,12,'#e8e4d8');
    }
  }
  if(state==='missed'){
    ps(bounced?'BOUNCED OFF...':'MISSED...',W/2,H/2+4,10,'#ff6a5e');
  }
  updateDrawPopups();
}

function drawSpeaker(){
  var x=286,y=6;
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillRect(x,y+2,3,4);
  ctx.beginPath();ctx.moveTo(x+3,y+2);ctx.lineTo(x+6,y);ctx.lineTo(x+6,y+8);ctx.lineTo(x+3,y+6);ctx.fill();
  if(muted){ctx.strokeStyle='#ff6a5e';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+8,y);ctx.lineTo(x+12,y+8);ctx.stroke();}
  else{ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x+7,y+4,3,-0.9,0.9);ctx.stroke();}
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='title')drawTitleScreen();
  else if(state==='won')drawWinScreen();
  else if(state==='lost')drawLoseScreen();
  else drawPlayfield();
  drawSpeaker();
  // iris wipe
  if(wipe>0){
    ctx.fillStyle='#000';
    var r=Math.max(W,H)*(1-wipe);
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(ball.x,ball.y,Math.max(0.1,r),0,6.29,true);ctx.fill();
    ctx.restore();
  }
  // white flash (final hoop scored)
  if(flashTimer>0){ctx.fillStyle='rgba(255,255,255,'+(flashTimer/10*0.8)+')';ctx.fillRect(0,0,W,H);}

  // ── blit to screen with shake + CRT glass ──
  sctx.fillStyle='#000';sctx.fillRect(0,0,W*SCALE,H*SCALE);
  var sx=shake>0.3?(Math.random()-0.5)*shake*2:0;
  var sy=shake>0.3?(Math.random()-0.5)*shake*2:0;
  sctx.drawImage(buf,Math.round(sx),Math.round(sy),W*SCALE,H*SCALE);
  sctx.drawImage(crt,0,0);
}

// CRT overlay: scanlines + vignette, pre-rendered once
var crt=document.createElement('canvas');crt.width=W*SCALE;crt.height=H*SCALE;
(function(){
  var c=crt.getContext('2d');
  for(var y=0;y<H*SCALE;y+=2){c.fillStyle='rgba(0,0,0,0.14)';c.fillRect(0,y+1,W*SCALE,1);}
  var g=c.createRadialGradient(W,H,H*0.9,W,H,W*1.35);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.38)');
  c.fillStyle=g;c.fillRect(0,0,W*SCALE,H*SCALE);
  // subtle rgb shimmer columns
  for(var x=0;x<W*SCALE;x+=6){c.fillStyle='rgba(255,255,255,0.012)';c.fillRect(x,0,1,H*SCALE);}
})();

// ── Name entry (works on desktop keyboards AND touch) ──
var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
var nameField=document.createElement('input');
nameField.type='text';nameField.setAttribute('maxlength','6');
nameField.setAttribute('autocapitalize','characters');nameField.setAttribute('autocomplete','off');
nameField.style.cssText='position:fixed;top:60%;left:50%;transform:translate(-50%,-50%);width:120px;height:28px;opacity:0.01;border:none;background:transparent;color:transparent;caret-color:transparent;';
nameField.addEventListener('input',function(){
  if(!enteringName)return;
  nameInput=(nameField.value||'').toUpperCase().replace(/[^A-Z0-9!? ]/g,'').substring(0,6);
});
var nameFieldArmed=false;
function beginNameEntry(){
  enteringName=true;nameInput='';savedName='';nameFieldArmed=false;
  nameField.value='';
  if(!nameField.parentNode)document.body.appendChild(nameField);
}
function endNameEntry(save){
  if(save&&nameInput.length>0){savedName=nameInput.toUpperCase();saveScore(nameInput,finalHoops);}
  else savedName='';
  enteringName=false;
  try{nameField.blur();}catch(e){}
}

// ── Input ───────────────────────────────────────────────
function fireShot(){
  var spd=power*5+1;
  ball.vx=Math.cos(aimAngle)*spd;ball.vy=Math.sin(aimAngle)*spd;
  var sweet=getSweetPower();
  perfectShot=Math.abs(power-sweet)<0.045;
  if(perfectShot){addPopup('PERFECT!',ball.x,ball.y-12,'#ffd75e',8);sPerfect();}
  scored=false;bounced=false;hoopPassed=false;prevBallY=ball.y;
  regSwing=12;grassKick(ball.x,ball.y+3,5);
  state='rolling';sKnock();
  if(hoopIndex===4)setAmb(0.003); // crowd holds its breath
}
function onAction(gx,gy){
  AC();
  // speaker toggle zone
  if(gx!==undefined&&gx>280&&gy<18){setMute(!muted);return;}
  if(state==='title'){
    bamfordScore=2;nasrScore=6;hoopIndex=0;scored=false;
    setupHoop();commentaryTimer=0;typeLen=0;state='commentary';sCoin();
  }
  else if(state==='commentary'){
    var full=commentaryFull();
    if(Math.floor(typeLen)<full.length){typeLen=full.length;} // first click: reveal all
    else{state='aiming';heartbeatTimer=50;}
  }
  else if(state==='aiming'){state='power';power=0;powerDir=1;}
  else if(state==='power'){fireShot();}
  else if((state==='won'||state==='lost')&&enteringName){
    // touch: first tap opens the keyboard; another tap finishes (saves what's typed, or skips)
    if(isTouch&&!nameFieldArmed){nameFieldArmed=true;try{nameField.focus();}catch(e){}}
    else endNameEntry(true);
  }
  else if((state==='won'||state==='lost')&&!enteringName){state='title';droneOff();setAmb(0);}
}
screen.addEventListener('click',function(e){
  var r=screen.getBoundingClientRect();
  var gx=(e.clientX-r.left)/(r.width/W),gy=(e.clientY-r.top)/(r.height/H);
  onAction(gx,gy);
});
document.addEventListener('keydown',function(e){
  if(enteringName){
    if(e.key==='Enter'&&nameInput.length>0){e.preventDefault();endNameEntry(true);}
    else if(e.key==='Backspace'){if(e.target!==nameField)e.preventDefault();nameInput=nameInput.slice(0,-1);}
    else if(e.key.length===1&&nameInput.length<6&&/[a-zA-Z0-9!? ]/.test(e.key)){
      if(e.key===' ')e.preventDefault();
      if(e.target!==nameField)nameInput+=e.key.toUpperCase(); // focused field feeds via its input event
    }
    return;
  }
  if(e.key==='m'||e.key==='M'){setMute(!muted);return;}
  if(e.key===' '||e.key==='Enter'){if(e.repeat)return;e.preventDefault();onAction();}
});

// ── Boot ────────────────────────────────────────────────
if(location.search.indexOf('embed')!==-1)document.body.classList.add('embed');
var _lb=null;
try{_lb=JSON.parse(lsGet('bamford-lb')||'null');}catch(e){}
if(_lb&&_lb[0]&&_lb[0].name==='CLAUDE'&&_lb[0].hoops===5)lsDel('bamford-lb');
// fixed 60Hz simulation step, whatever the display refresh rate
var lastTs=0,acc=0,STEP=1000/60;
function gameLoop(ts){
  if(!lastTs)lastTs=ts;
  acc+=Math.min(100,ts-lastTs);lastTs=ts;
  while(acc>=STEP){update();acc-=STEP;}
  draw();
  requestAnimationFrame(gameLoop);
}
Promise.all([document.fonts.load('8px PS2P'),document.fonts.load('12px VT')])
  .catch(function(){})
  .then(function(){requestAnimationFrame(gameLoop);});
</script>
